<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shorts Generator</title>
<style>
:root{--bg:#101218;--panel:#181b24;--line:#272b38;--text:#eceef5;--mute:#8d93a8;--acc:#7c8cff;--acc2:#9aa6ff;--err:#ff7a8a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Avenir Next",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:920px;margin:0 auto;padding:56px 20px 80px}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 28px;font-weight:700}
form{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
input[type=url]{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:16px;font-size:16px}
input[type=url]:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button,.btn{background:var(--acc);color:#0c0e18;border:0;border-radius:14px;padding:16px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;text-align:center;white-space:nowrap}
button:hover,.btn:hover{background:var(--acc2)}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:flex;gap:10px;color:var(--mute);font-size:14px;align-items:flex-start}
label input{margin-top:4px;accent-color:var(--acc)}
#status{margin-top:28px;display:none}
#bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .6s}
#err{color:var(--err);margin-top:16px;display:none}
#out{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:36px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
video{width:100%;aspect-ratio:9/16;background:#000;display:block}
.meta{padding:14px;display:flex;flex-direction:column;gap:12px}
.meta p{margin:0;font-weight:600;line-height:1.3}
.meta small{color:var(--mute);font-weight:400}
@media(max-width:520px){.row{flex-direction:column}main{padding-top:36px}#out{grid-template-columns:1fr 1fr;gap:12px}}
@media(prefers-reduced-motion:reduce){#bar i{transition:none}}
</style></head><body>
<main>
<h1>Turn a video into Shorts.</h1>
<form id="f">
 <div class="row"><input id="url" type="url" placeholder="Paste a YouTube link" required autocomplete="off" inputmode="url"><button id="go">Generate Shorts</button></div>
 <label><input id="ok" type="checkbox" required> I own this video or have permission to use it.</label>
</form>
<div id="err" role="alert"></div>
<div id="status" aria-live="polite"><span id="step"></span><div id="bar"><i></i></div></div>
<section id="out"></section>
</main>
<script>
const $=s=>document.querySelector(s);
const f=$('#f'),go=$('#go'),err=$('#err'),st=$('#status'),out=$('#out');
let shown=0,timer;
const showErr=m=>{err.textContent=m;err.style.display=m?'block':'none'};
f.onsubmit=async e=>{
  e.preventDefault();showErr('');out.innerHTML='';shown=0;clearTimeout(timer);
  go.disabled=true;go.textContent='Working…';st.style.display='block';$('#step').textContent='Starting';$('#bar i').style.width='2%';
  try{
    const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('#url').value,permission:$('#ok').checked})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed.');
    poll(d.id);
  }catch(x){fail(x.message)}
};
function fail(m){showErr(m);st.style.display='none';go.disabled=false;go.textContent='Generate Shorts'}
async function poll(id){
  try{
    const r=await fetch('/api/jobs/'+id);const d=await r.json();if(!r.ok)throw new Error(d.error);
    $('#step').textContent=d.step;$('#bar i').style.width=Math.max(2,d.progress)+'%';
    d.clips.slice(shown).forEach(c=>{out.append(card(id,c))});shown=d.clips.length;
    if(d.status==='error')return fail(d.error);
    if(d.status==='done'){st.style.display='none';go.disabled=false;go.textContent='Generate Shorts';return}
    timer=setTimeout(()=>poll(id),2500);
  }catch(x){fail(x.message||'Connection lost. Try again.')}
}
function card(id,c){
  const el=document.createElement('div');el.className='card';
  const u=`/files/${id}/${c.file}`;
  el.innerHTML=`<video controls playsinline preload="metadata" src="${u}#t=0.1"></video><div class="meta"><p></p><a class="btn" href="${u}?download=1" download="${c.file}">Download MP4</a></div>`;
  el.querySelector('p').innerHTML='';
  const p=el.querySelector('p');p.textContent=c.hook;
  const s=document.createElement('small');s.textContent=' '+c.duration+'s';p.append(s);
  return el;
}
</script></body></html>
